[project]
name = "steamsell"
version = "0.1.0"
description = "Telegram shop with Monobank acquiring"
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3.15,<4",
  "fastapi>=0.115,<1",
  "uvicorn>=0.32,<1",
  "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.30,<1",
  "alembic>=1.14,<2",
  "redis>=5,<7",
  "httpx>=0.28,<1",
  "cryptography>=44",
  "pydantic-settings>=2.7,<3",
  "tzdata>=2025.1",
  "pillow>=11,<13",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "aiosqlite>=0.20", "ruff>=0.9"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
